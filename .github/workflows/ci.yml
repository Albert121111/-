name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Backend unit tests
        run: npm run test

      - name: Static checks
        run: |
          node --check scripts/up.mjs
          node --check backend/src/server.js
          node --check backend/scripts/seedLocations.js
